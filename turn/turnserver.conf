# coturn configuration of the otr.to TURN relay, see turn/README.md.
# Every deploy copies this file to /opt/otr-turn/releases/<version>/ and restarts otr-turn.

# TURN over UDP and TCP on the standard port. There is no TLS: port 443 belongs
# to the other service on the VPS, and TLS on 5349 gets through hardly any
# firewall that stops 3478.
listening-port=3478
no-tls
no-dtls

# Relay ports, above the range Linux hands out for outgoing connections
# (net.ipv4.ip_local_port_range, 32768-60999), so the relay never takes a port
# another program on the VPS is about to use.
min-port=61000
max-port=65535

# One user for every browser. The web app ships the password, so it is public;
# it only keeps the relay from being open to anyone who does not look.
# src/Chat.tsx has the same, a test checks that both agree.
lt-cred-mech
realm=turn.otr.to
user=otr:g2TWHJVSMpSxLe23effavSMo
fingerprint
stale-nonce=600
# The users are the one above. An empty database in memory keeps coturn from
# opening /var/lib/turn/turndb, which otr-turn.service has no access to.
userdb=:memory:

# Bandwidth, each direction counted on its own. One allocation gets at most
# 2 Mbit/s, which is plenty for a chat and its files and makes the relay
# useless for video. All of them together get at most 200 Mbit/s, so the relay
# cannot fill the line of the VPS for the other service on it. Every browser
# holds two allocations per person it talks to (UDP and TCP), whether or not
# the chat ends up going through the relay, which gives room for about 25
# chats of two at full speed; further ones get what is left, then no relay.
max-bps=250000
bps-capacity=25000000

# Browsers only relay UDP to each other. No TCP relay (RFC 6062), and no
# relaying into loopback, private, link-local, multicast or reserved networks,
# so the relay cannot reach anything a stranger on the internet could not.
no-tcp-relay
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Nothing for the outside but STUN and TURN, and no version to look up.
no-cli
no-software-attribute
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Into the journal through syslog, which keeps the levels: otr-turn.service
# drops everything below a warning, so no line names who used the relay.
syslog
no-stdout-log
