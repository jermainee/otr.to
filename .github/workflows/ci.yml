name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a PR makes the run for the previous one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage -- --ci

      # ts-loader type-checks the app while bundling, so this doubles as the
      # type check for everything the entry point reaches.
      - run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The suite builds the bundle itself and serves public/ the way a web
      # server would, so this covers the real thing end to end.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
